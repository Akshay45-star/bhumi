version: "3.9"

services:
  # ─── Postgres database ────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     bhumi
      POSTGRES_PASSWORD: bhumi_secret
      POSTGRES_DB:       bhumi
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhumi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Bhumi API ────────────────────────────────────────────────────────────────
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV:             production
      PORT:                 3000
      DATABASE_URL:         postgresql://bhumi:bhumi_secret@db:5432/bhumi
      JWT_SECRET:           ${JWT_SECRET:-change_this_in_production_please}
      APP_URL:              ${APP_URL:-http://localhost:3000}

      # Cloudflare R2 — video storage
      R2_ACCOUNT_ID:        ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID:     ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET:            ${R2_BUCKET:-bhumi-videos}
      R2_PUBLIC_URL:        ${R2_PUBLIC_URL:-}

      # SendGrid — email delivery
      SENDGRID_API_KEY:     ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL:  ${SENDGRID_FROM_EMAIL:-support@bhumi.app}
      SENDGRID_FROM_NAME:   ${SENDGRID_FROM_NAME:-Bhumi}

      # Expo push notifications
      EXPO_ACCESS_TOKEN:    ${EXPO_ACCESS_TOKEN:-}

      # OpenAI — life summary (optional)
      OPENAI_API_KEY:       ${OPENAI_API_KEY:-}

      # HMAC secret for deadman confirm URLs
      HMAC_SECRET:          ${HMAC_SECRET:-change_this_too}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
